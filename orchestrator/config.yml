# orchestrator/config.yml

source:
  adapter: markdown          # markdown | github | linear
  label: feature-marker      # for github/linear
  file: features.md          # for markdown adapter

autonomy: checkpoint         # supervised | checkpoint | full_auto

execution:
  max_concurrent: 1          # parallel worktrees (v1)
  skip_done: true            # skip items with status=done
  skip_blocked: true         # verify blocked features
  base_branch: main          # branch to create worktrees from
  pr_strategy: draft         # draft | ready | none

features:
  propagate_context: true    # propagate context from completed features
  track_errors: true         # log error patterns for future avoidance
  resume_on_restart: true    # resume from last checkpoint on restart
  max_retries: 2             # retry failed features up to N times

feedback:
  update_manifest: true      # re-run environment discovery between features
  collect_patterns: true     # collect error patterns for cross-feature awareness
  global_context: true       # append rich context after each feature

safety:
  breaking_change_pause: true   # pause on breaking changes regardless of autonomy
  schema_change_warning: true   # warn when schema changes detected
  lint_before_commit: true      # verify repo at each step

pr_creation:
  strategy: draft            # draft | ready
  auto_assign: true          # auto-assign reviewers
  auto_merge: false          # auto-merge after CI (full_auto only)
