# orchestrator — Backlog Source Configuration
#
# This file contains provider parameters but NOT API keys.
# Keys are loaded from .env at runtime.
# This file defines WHICH provider and HOW to fetch.

source:
  # Active adapter to run before starting the loop.
  # One of: markdown | github | linear
  adapter: markdown

  # File to write adapter output. The orchestrator reads this.
  output: orchestration-backlog.json

  # Provider-specific parameters.
  # Only the active adapter's section is used.
  # All others are ignored at runtime.

  markdown:
    file: features.md          # Relative to project root
    # That's all — no auth needed

  github:
    label: feature-marker      # Filter issues by label (optional)
    state: open                # open | closed | all
    # Auth: uses gh CLI auth, no env vars needed
    # Run: gh auth login

  linear:
    team: ENG                  # Filter issues by team
    # Auth: LINEAR_API_KEY from .env

  jira:
    project: PRJ               # Jira project key
    jql: status = "To Do"      # JQL filter (optional)
    # Auth: JIRA_URL, JIRA_EMAIL, JIRA_TOKEN from .env

  notion:
    database_id: abc123        # Notion database ID
    filter_property: Status
    filter_value: To Do
    # Auth: NOTION_TOKEN from .env

autonomy: checkpoint           # supervised | checkpoint | full_auto

# Future — not implemented in this plan (ADR-003)
preprocessing:
  enabled: false
  model: null
  limits: {}

execution:
  max_concurrent: 1            # parallel worktrees (v1)
  skip_done: true
  skip_blocked: true
  base_branch: main

worktrees:
  base_path: .worktrees
  branch_prefix: feat
  auto_cleanup: true

# Memory (per ADR-002)
memory:
  carry_forward_from: global-context.md
  error_pattern_window: 5
  env_refresh: true

safety:
  breaking_change_pause: true
  schema_migration_review: true
  max_file_changes: 50

pr_creation:
  strategy: draft              # draft | ready | none
  auto_assign: true

notifications:
  on_complete: true
  on_failure: true

metrics:
  enabled: true
  collect_timing: true

# Agent Discovery and Task Routing (ADR-006)
discovery:
  enabled: true              # Run agent discovery before each orchestration
  scan_only_threshold: 0     # Min agents required to run split mode (0 = always if any)

routing:
  prefer_agents: true        # Prefer discovered agents over feature-marker
  fallback: feature-marker   # "fallback" tagged tasks to feature-marker regardless of agents
  force_review: false        # Force all "review" tagged tasks to a specific agent

# Checkpoint monitoring — shell visibility into the monolithic invocation
monitoring:
  enabled: true              # Poll checkpoint.json for phase transitions
  poll_interval_seconds: 1   # Polling frequency (checkpoint writes are infrequent)
  phase_log: true            # Log phase transitions to phases.log

# Post-hoc agents — conditional lightweight verification after implementation
#
# Token cost per invocation:
#   Main pipeline (feature-marker): ~7,500 tokens context overhead
#   QA agent (qa-reviewer):         ~2,500 tokens (lightweight)
#   Review agent (review-agent):    ~2,500 tokens (lightweight)
#
# Cost profiles for 5 features:
#   All succeed, no QA/review:          5 invocations  = ~37,500 tokens  (1.0x)
#   All succeed + conditional QA:       5 + 5 QA       = ~50,000 tokens  (1.3x)
#   All succeed + QA + review:          5 + 5 + 5      = ~62,500 tokens  (1.7x)
#   2 failures with smart retry:        5 + 2 QA + 2   = ~57,500 tokens  (1.5x)
#   Worst case (all fail + QA + retry): 5 + 5 + 5 + 5  = ~100,000 tokens (2.7x)
#
posthoc:
  qa_review: conditional     # always | conditional | never
  qa_trigger: test_failure   # test_failure | always | breaking_change
  review_trigger: full_auto  # full_auto | always | never
  max_posthoc_per_feature: 2 # Budget cap for post-hoc invocations per feature

# Post-hoc review — independent code review before PR creation
review:
  enabled: true
  max_cycles: 2              # Max review-fix cycles before accepting
  checklist_source: knowledge-base  # knowledge-base | static | custom

# Skill delegation — use Claude skills for orchestrator operations instead of
# shell fallbacks. Each skill invocation starts a new Claude session (~7,500
# tokens overhead), so this is disabled by default. Shell fallbacks produce
# identical results at zero token cost.
#
# When enabled, these operations use skills:
#   /context-builder  → builds feature context (replaces shell section 3d)
#   /collect-results  → collects results from git state (replaces section 3f)
#   /safety-check     → classifies breaking changes intelligently (replaces 3g)
#   /kb-learn         → records patterns with richer analysis (replaces 3i)
#   /orch-status      → renders interactive dashboard (replaces Steps 5-6)
#
# Cost: up to 5 extra invocations per feature × ~7,500 = ~37,500 tokens.
# For 5 features: ~187,500 additional tokens. NOT recommended for batch runs.
#
# Set ORCHESTRATOR_USE_SKILLS=true environment variable to enable.
# Skills are always available for interactive use via /skill-name in Claude Code.
