# orchestrator/config.yml

source:
  adapter: markdown          # markdown | github | linear
  label: feature-marker      # for github/linear
  file: features.md          # for markdown adapter

autonomy: checkpoint         # supervised | checkpoint | full_auto

# Future — not implemented in this plan
preprocessing:
  enabled: false
  model: null
  limits: {}

execution:
  max_concurrent: 1          # parallel worktrees (v1)
  skip_done: true
  skip_blocked: true
  base_branch: main

worktrees:
  base_path: .worktrees
  branch_prefix: feat
  auto_cleanup: true

# Memory (per ADR-002)
memory:
  carry_forward_from: global-context.md    # Layer 1: propagate changes between features
  error_pattern_window: 5                  # Layer 2: keep last N errors
  env_refresh: true                        # Layer 3: re-run env discovery

safety:
  breaking_change_pause: true
  schema_migration_review: true
  max_file_changes: 50

# PR creation
pr_creation:
  strategy: draft            # draft | ready | none
  auto_assign: true

notifications:
  on_complete: true
  on_failure: true

metrics:
  enabled: true
  collect_timing: true
