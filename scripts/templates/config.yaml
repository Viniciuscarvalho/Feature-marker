source:
  adapter: markdown
  output: orchestration-backlog.json
  markdown:
    file: features.md
  github:
    label: feature-marker
    state: open
  linear:
    team: ENG

autonomy: checkpoint

model:
  default: opusplan

execution:
  base_branch: main
  skip_done: true
  skip_blocked: true

worktrees:
  base_path: .worktrees
  branch_prefix: feat
  auto_cleanup: true

memory:
  carry_forward_from: global-context.md
  error_pattern_window: 5
  env_refresh: true

safety:
  breaking_change_pause: true
  schema_migration_review: true
  max_file_changes: 50

pr_creation:
  strategy: draft
  auto_assign: true

discovery:
  enabled: true

routing:
  prefer_agents: true
  fallback: feature-marker
