<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - subtle gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89b4fa"/>
      <stop offset="100%" style="stop-color:#74a8f7"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)"/>

  <!-- Feature flag icon - modern, clean -->
  <g transform="translate(110, 96)">
    <!-- Pole -->
    <rect x="40" y="20" width="16" height="280" rx="8" fill="#6c7086"/>

    <!-- Flag shape - modern geometric -->
    <path d="M56 20 L56 140 L220 100 L180 80 L220 60 L56 20Z" fill="url(#accentGrad)"/>

    <!-- Checkpoint dots representing progress -->
    <circle cx="48" cy="180" r="14" fill="#a6e3a1"/>
    <circle cx="48" cy="230" r="14" fill="#a6e3a1" opacity="0.6"/>
    <circle cx="48" cy="280" r="14" fill="#6c7086" opacity="0.4"/>
  </g>
</svg>
