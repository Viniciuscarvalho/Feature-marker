<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="feature-marker banner peekaboo-style">
  <defs>
    <linearGradient id="window-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#121214"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="#0D1117"/>

  <!-- Background grid (subtle) -->
  <g opacity="0.05">
    <path d="M0 50 H1600 M0 100 H1600 M0 150 H1600 M0 200 H1600 M0 250 H1600 M0 300 H1600 M0 350 H1600" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Left Side: Terminal Mockup -->
  <g transform="translate(100, 60)">
    <rect width="500" height="280" rx="12" fill="url(#window-bg)" stroke="#30363d" stroke-width="1"/>
    <g transform="translate(15, 12)">
      <circle cx="10" cy="10" r="6" fill="#ff5f56"/>
      <circle cx="30" cy="10" r="6" fill="#ffbd2e"/>
      <circle cx="50" cy="10" r="6" fill="#27c93f"/>
    </g>
    <text x="20" y="60" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace" font-size="14">
      <tspan x="20" dy="1.5em">$ /feature-marker --interactive</tspan>
      <tspan x="20" dy="1.5em" fill="#58a6ff">Analyzing project stack...</tspan>
      <tspan x="20" dy="1.5em" fill="#3fb950">✓ Detected iOS/Swift project</tspan>
      <tspan x="20" dy="1.5em" fill="#3fb950">✓ Checkpoint reached: AC_LOCK</tspan>
      <tspan x="20" dy="1.5em"> </tspan>
      <tspan x="20" dy="1.5em" fill="#8b949e">Current Phase: Implementation</tspan>
      <tspan x="20" dy="1.5em" fill="#d29922">Running: swift test --parallel</tspan>
    </text>
  </g>

  <!-- Right Side: Spec Visualization -->
  <g transform="translate(1000, 60)">
    <rect width="500" height="280" rx="12" fill="url(#window-bg)" stroke="#30363d" stroke-width="1"/>
    <!-- Spec Mockup Lines -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="400" height="15" rx="4" fill="#30363d" opacity="0.6"/>
      <rect x="0" y="30" width="300" height="15" rx="4" fill="#30363d" opacity="0.6"/>
      <rect x="0" y="60" width="350" height="15" rx="4" fill="#30363d" opacity="0.6"/>
      <rect x="0" y="90" width="200" height="15" rx="4" fill="#30363d" opacity="0.6"/>
      <rect x="0" y="120" width="380" height="15" rx="4" fill="#30363d" opacity="0.6"/>
      <rect x="0" y="150" width="250" height="15" rx="4" fill="#30363d" opacity="0.6"/>
    </g>
    <!-- Vision Bounding Boxes -->
    <rect x="25" y="35" width="410" height="50" rx="2" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,2"/>
    <rect x="25" y="95" width="360" height="25" rx="2" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- Floating Tooltips -->
    <g transform="translate(420, 45)">
      <rect width="80" height="20" rx="4" fill="#3fb950"/>
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">TECH SPEC</text>
    </g>
    <g transform="translate(370, 100)">
      <rect width="80" height="20" rx="4" fill="#d29922"/>
      <text x="40" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CHECKPOINT</text>
    </g>
  </g>

  <!-- Central Header -->
  <g transform="translate(800, 200)">
    <text x="0" y="0" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" text-anchor="middle" letter-spacing="-2">
      feature-marker 🫣
    </text>
    <text x="0" y="50" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="middle">
      Automate development workflows with AI-powered checkpoints
    </text>
  </g>

  <!-- Platform Badges (subtle) -->
  <g transform="translate(800, 320)" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace" font-size="12" opacity="0.8">
    <text x="-150" y="0">PRD</text>
    <circle cx="-180" cy="-4" r="2" fill="#3fb950"/>
    <text x="-50" y="0">TECH SPEC</text>
    <circle cx="-95" cy="-4" r="2" fill="#58a6ff"/>
    <text x="50" y="0">TASKS</text>
    <circle cx="15" cy="-4" r="2" fill="#d29922"/>
    <text x="150" y="0">PR CREATION</text>
    <circle cx="105" cy="-4" r="2" fill="#bc8cff"/>
  </g>
</svg>
